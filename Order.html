<!DOCTYPE html>
<html>
<head>
<title>Order FruitShell</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
<div class="logo">🍊 FruitShell</div>
</nav>

<h1 class="section-title">Place Order</h1>

<div class="card" style="max-width:700px;margin:auto;">

<label>Select Product</label>

<select id="product" style="width:100%;padding:12px;">
<option value="129">Orange Shell ₹129</option>
<option value="149">Mango Shell ₹149</option>
<option value="159">Coconut Shell ₹159</option>
<option value="169">Pineapple Shell ₹169</option>
</select>

<br><br>

<label>Quantity</label>

<input
type="number"
id="qty"
value="1"
min="1"
style="width:100%;padding:12px;">

<br><br>

<button class="btn" onclick="calculateOrder()">
Calculate Total
</button>

<br><br>

<div id="orderResult"></div>

</div>

<script>
function calculateOrder(){

let price =
parseInt(document.getElementById("product").value);

let qty =
parseInt(document.getElementById("qty").value);

let total = price * qty;

document.getElementById("orderResult").innerHTML=
`
<h2>Total Bill</h2>
<h3>₹${total}</h3>
`;

}
</script>

</body>
</html>
